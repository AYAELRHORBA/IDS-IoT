# ================================================
# mosquitto.conf — Configuration Broker MQTT
# ================================================

# Port d'écoute standard MQTT
listener 1883

# Connexions sans authentification autorisées
# (environnement simulé local — pas de production)
allow_anonymous true

# Logs complets pour le débogage
log_type all

# ------------------------------------------------
# Topics définis dans le projet
# ------------------------------------------------
# iot/node_1/traffic  → Capteur Température
# iot/node_2/traffic  → Capteur Humidité
# iot/node_3/traffic  → Compteur Intelligent
# iot/node_4/traffic  → Caméra IP
# iot/node_5/traffic  → Actuateur
# iot/ids/alertes     → Alertes IDS (Node-RED → Dashboard)